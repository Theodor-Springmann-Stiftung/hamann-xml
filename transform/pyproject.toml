[project]
name = "hamann-xml-transform"
version = "0.1.0"
description = "Normalize historical German in Hamann XML while preserving inline markup"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.3",
  "torch>=2.6",
  "tqdm>=4.67",
  "transformers>=4.48,<5",
]

[project.scripts]
transnorm-xml = "hamann_transform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hamann_transform"]

[dependency-groups]
dev = ["pytest>=8.3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
